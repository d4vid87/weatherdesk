name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The three build jobs run in parallel and would each create their own draft,
  # so the release has to exist before any of them start.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create it through the API so the new release's id comes straight back —
          # a draft has no git tag yet, so it can't be looked up by tag afterwards.
          id=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name='${{ github.ref_name }}' \
            -f name='WeatherDesk ${{ github.ref_name }}' \
            -f body='Download the installer for your OS below. See the README for first-run notes (the apps are unsigned).' \
            -F draft=true -q .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          # Raspberry Pi 4/5 on 64-bit Pi OS. Native arm64 runner, not a cross-compile:
          # WebKitGTK doesn't cross-link cleanly and the runner is free for public repos.
          - platform: ubuntu-22.04-arm
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
