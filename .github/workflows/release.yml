name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # The three build jobs run in parallel and would each create their own draft,
  # so the release has to exist before any of them start.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      notes: ${{ steps.create.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag's section of the changelog becomes the release body and, via the
          # notes output, the updater feed's notes — otherwise latest.json ships "".
          v=${GITHUB_REF_NAME#v}
          notes=$(awk -v v="$v" '/^## \[/{f=($2=="["v"]")} f' CHANGELOG.md | tail -n +2)
          body="Download the installer for your OS below. See the README for first-run notes (the apps are unsigned).

          $notes"
          # Create it through the API so the new release's id comes straight back —
          # a draft has no git tag yet, so it can't be looked up by tag afterwards.
          id=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name='${{ github.ref_name }}' \
            -f name='WeatherDesk ${{ github.ref_name }}' \
            -f body="$body" \
            -F draft=true -q .id)
          test -n "$id"
          { echo "id=$id"; echo 'notes<<WD_EOF'; echo "$notes"; echo WD_EOF; } >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          # One universal APK: arm64 for anything current, armv7 so a 32-bit Fire tablet still
          # installs it. Signed with the upload key held in repo secrets — same key forever, or
          # Android refuses the update.
          - platform: ubuntu-22.04
            mobile: android
            args: "--apk --target aarch64 --target armv7"
            targets: "aarch64-linux-android,armv7-linux-androideabi"
          # Raspberry Pi 4/5 on 64-bit Pi OS. Native arm64 runner, not a cross-compile:
          # WebKitGTK doesn't cross-link cleanly and the runner is free for public repos.
          - platform: ubuntu-22.04-arm
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu') && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up the Android toolchain
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point the build at the runner's NDK and unpack the signing key
        if: matrix.mobile == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          keyAlias=upload
          password=$KEYSTORE_PASSWORD
          EOF

      - uses: tauri-apps/tauri-action@v0
        if: matrix.mobile != 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. Without these the desktop builds still succeed, but
          # nothing already installed will accept them as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Only this input — not the release's own body — feeds latest.json's notes.
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      # tauri-action has no notion of a mobile build — it would run `tauri build --apk`, which is
      # not a thing. So the APK is built and uploaded by hand. The upload goes through the API with
      # the release id: the release is still a draft here, and a draft can't be looked up by tag.
      - name: Build and upload the APK
        if: matrix.mobile == 'android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # As a cargo subcommand, not the npm package: Gradle's rust plugin shells out to
          # `cargo tauri` while assembling the APK, and an npm-installed `tauri` on PATH does not
          # satisfy that. Prebuilt binary — `cargo install tauri-cli` compiles for ~10 minutes.
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --force 'tauri-cli@^2'
          cargo tauri android build ${{ matrix.args }}
          apk=$(find src-tauri/gen/android -name 'app-universal-release.apk' | head -1)
          test -n "$apk"
          gh api --method POST \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=WeatherDesk_${{ github.ref_name }}.apk" \
            --input "$apk"

  # Windows Defender false-positives new unsigned installers, and the only honest answer to "is
  # this safe?" is a checksum published beside the download. Runs after every build job so the
  # list covers all of them.
  #
  # Manual step for each Windows release, and the reason we don't buy a certificate: submit the
  # .msi at microsoft.com/wdsi/filesubmission as "Software developer" → "Incorrectly detected as
  # malware". Turnaround is usually a day, and it clears the detection for everyone.
  checksums:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir assets && cd assets
          # The release is still a draft, so its assets are fetched by id rather than by tag.
          gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            -q '.[] | "\(.id) \(.name)"' | while read -r id name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/${{ github.repository }}/releases/assets/$id" > "$name"
          done
          sha256sum ./* > ../SHA256SUMS.txt
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
            --input ../SHA256SUMS.txt

  # The headless image, for a house whose always-on machine has no desktop. Two native runners
  # rather than qemu: an emulated arm64 Rust build takes the better part of an hour.
  docker:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: amd64
          - platform: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }}

  # One tag both architectures answer to, so `docker pull` works on a Pi and a NAS alike.
  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for tag in "${{ github.ref_name }}" latest; do
            docker buildx imagetools create -t "ghcr.io/${{ github.repository }}:$tag" \
              "ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64" \
              "ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64"
          done
