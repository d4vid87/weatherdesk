name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The three build jobs run in parallel and would each create their own draft,
  # so the release has to exist before any of them start.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create it through the API so the new release's id comes straight back —
          # a draft has no git tag yet, so it can't be looked up by tag afterwards.
          id=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name='${{ github.ref_name }}' \
            -f name='WeatherDesk ${{ github.ref_name }}' \
            -f body='Download the installer for your OS below. See the README for first-run notes (the apps are unsigned).' \
            -F draft=true -q .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          # One universal APK: arm64 for anything current, armv7 so a 32-bit Fire tablet still
          # installs it. Signed with the upload key held in repo secrets — same key forever, or
          # Android refuses the update.
          - platform: ubuntu-22.04
            mobile: android
            args: "--apk --target aarch64 --target armv7"
            targets: "aarch64-linux-android,armv7-linux-androideabi"
          # Raspberry Pi 4/5 on 64-bit Pi OS. Native arm64 runner, not a cross-compile:
          # WebKitGTK doesn't cross-link cleanly and the runner is free for public repos.
          - platform: ubuntu-22.04-arm
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu') && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up the Android toolchain
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point the build at the runner's NDK and unpack the signing key
        if: matrix.mobile == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          keyAlias=upload
          password=$KEYSTORE_PASSWORD
          EOF

      - uses: tauri-apps/tauri-action@v0
        if: matrix.mobile != 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # tauri-action has no notion of a mobile build — it would run `tauri build --apk`, which is
      # not a thing. So the APK is built and uploaded by hand. The upload goes through the API with
      # the release id: the release is still a draft here, and a draft can't be looked up by tag.
      - name: Build and upload the APK
        if: matrix.mobile == 'android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri android build ${{ matrix.args }}
          apk=$(find src-tauri/gen/android -name 'app-universal-release.apk' | head -1)
          test -n "$apk"
          gh api --method POST \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=WeatherDesk_${{ github.ref_name }}.apk" \
            --input "$apk"
