<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Batman WX</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="palettes.js"></script>
<style>
  /* zoom.earth-matched shell: #141a22 cards, #0a84ff accent, rounded sans */
  :root { --bg:#141a22; --bg2:#1c242e; --ink:#fff; --dim:#8a97a5; --line:#272d35; --blue:#0a84ff; --blue2:#1a8cff; }
  * { box-sizing:border-box; margin:0; }
  html,body,#map { height:100%; width:100%; background:#0b0f14; font-family:"Nunito Sans",system-ui,sans-serif; color:var(--ink); overflow:hidden; }
  body { position:fixed; inset:0; overscroll-behavior:none; }
  #map { position:absolute; inset:0; height:auto; width:auto; }
  button { font:inherit; color:inherit; }
  .card { background:rgba(20,26,34,.92); border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,.45); backdrop-filter:blur(6px); }

  /* brand card */
  #brand { position:absolute; top:10px; left:10px; z-index:6; width:172px; display:flex; align-items:center; gap:9px; padding:9px 12px; user-select:none; }
  #brand svg { width:34px; height:21px; flex:none; }
  #brand span { font-size:14.5px; font-weight:800; letter-spacing:.4px; white-space:nowrap; }
  #brand span b { color:#ffd60a; font-weight:800; }

  /* left panel — WEATHER MAPS */
  #panel { position:absolute; top:60px; left:10px; z-index:6; width:172px; padding:6px 0 8px; user-select:none; }
  #panel h2 { font-size:10.5px; font-weight:800; letter-spacing:1.2px; color:var(--dim); padding:7px 14px 6px; display:flex; justify-content:space-between; cursor:pointer; }
  #panel h2 .chev { transition:transform .2s; font-size:10px; }
  #panel.closed .chev { transform:rotate(180deg); }
  #panel.closed .row, #panel.closed .sect { display:none; }
  .row { display:flex; align-items:center; gap:11px; padding:7px 14px; cursor:pointer; font-size:13.5px; font-weight:600; color:#cfd8e1; border-left:3px solid transparent; }
  .row:hover { background:#ffffff10; }
  .row.on { color:#fff; background:#ffffff14; border-left-color:var(--blue); }
  .row .ic { width:18px; text-align:center; font-size:14px; filter:grayscale(1) brightness(1.6); }
  .row.on .ic { filter:none; }
  .sect { border-top:1px solid var(--line); margin-top:6px; padding-top:6px; }
  .sect .row { font-size:12.5px; padding:5px 14px; }
  .sect .row.on { border-left-color:transparent; background:none; }
  .sect .row .dot { margin-left:auto; width:26px; height:14px; border-radius:8px; background:#39424d; position:relative; transition:background .15s; flex:none; }
  .sect .row .dot::after { content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#aab6c2; transition:left .15s, background .15s; }
  .sect .row.on .dot { background:var(--blue); }
  .sect .row.on .dot::after { left:14px; background:#fff; }

  /* right icon rail */
  #rail { position:absolute; top:10px; right:10px; z-index:6; display:flex; flex-direction:column; gap:8px; }
  .rbtn { width:38px; height:38px; border:none; border-radius:50%; background:rgba(20,26,34,.92); color:#cfd8e1; font-size:15px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.4); position:relative; }
  .rbtn:hover { color:#fff; background:#232c37; }
  .rbtn.off { opacity:.55; }
  #acount { position:absolute; top:-5px; right:-5px; background:#ff453a; color:#fff; font-size:9.5px; font-weight:800; padding:1px 5px; border-radius:99px; }
  #zoomctl { position:absolute; right:10px; bottom:96px; z-index:6; display:flex; flex-direction:column; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  #zoomctl button { width:38px; height:36px; border:none; background:rgba(20,26,34,.92); color:#cfd8e1; font-size:17px; cursor:pointer; }
  #zoomctl button:hover { color:#fff; background:#232c37; }
  #zoomctl button:first-child { border-bottom:1px solid var(--line); }

  /* search drop-down */
  #searchwrap { position:absolute; top:10px; right:56px; z-index:7; width:min(320px,80vw); display:none; }
  #search { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:#fff; outline:none; font-size:14px; font-family:inherit; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #search::placeholder { color:var(--dim); }
  #search:focus { border-color:var(--blue); }
  #results { margin-top:6px; overflow:hidden; display:none; }
  #results > div { display:flex; gap:10px; align-items:center; padding:9px 13px; cursor:pointer; font-size:13.5px; line-height:1.25; }
  #results > div:hover, #results > div.sel { background:#ffffff12; }
  #results > div.sel { box-shadow:inset 2px 0 0 var(--blue); }
  #results .ico { font-size:15px; flex:none; }
  #results small { color:var(--dim); display:block; }
  #results .empty { cursor:default; padding:10px 14px; }
  #sites { position:absolute; top:98px; right:56px; z-index:7; width:250px; display:none; padding:8px; }
  #sitefilter { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg2); color:#fff; font:inherit; font-size:13px; outline:none; }
  #sitefilter:focus { border-color:var(--blue); }
  #sitelist { max-height:50vh; overflow-y:auto; margin-top:6px; }
  #sitelist > div { padding:6px 8px; border-radius:7px; cursor:pointer; font-size:13px; display:flex; gap:7px; align-items:baseline; }
  #sitelist > div:hover { background:#ffffff12; }
  #sitelist small { color:var(--dim); }

  /* bottom-center timeline pill (zoom.earth style) */
  #timeline { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:6; display:flex; align-items:center; gap:2px; padding:5px 8px 5px 5px; border-radius:12px; }
  #play { width:34px; height:34px; border-radius:9px; border:none; background:none; color:#fff; font-size:14px; cursor:pointer; flex:none; }
  #play:hover { background:#ffffff14; }
  #scrubwrap { width:min(180px,26vw); position:relative; height:24px; display:flex; align-items:center; margin:0 6px; }
  #scrub { -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px; background:#39424d; outline:none; cursor:pointer; }
  #scrub::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff; cursor:grab; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  #scrub::-moz-range-thumb { width:9px; height:9px; border-radius:50%; background:#fff; border:none; cursor:grab; }
  #nowmark { position:absolute; top:4px; width:2px; height:16px; background:var(--blue2); border-radius:1px; pointer-events:none; }
  #ftdate, #fttime { font-size:13.5px; font-weight:700; padding:6px 8px; border-radius:8px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #fttime { min-width:86px; text-align:center; }
  #ftdate { color:#cfd8e1; }
  .fcast { color:#ffd60a !important; }
  #live { font-size:10px; font-weight:800; color:var(--dim); letter-spacing:.5px; padding:6px 8px; border:none; background:none; border-radius:8px; cursor:pointer; }
  #live::before { content:'●'; margin-right:3px; }
  #live:hover { background:#ffffff14; }
  #live.on { color:#ff453a; }
  #live.on::before { animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  #tstep { width:30px; height:34px; border:none; background:none; border-radius:8px; color:#cfd8e1; cursor:pointer; font-size:13px; }
  #tstep:hover { background:#ffffff14; }
  #histchips { display:flex; gap:2px; margin-left:4px; }
  .chip { padding:3px 8px; border-radius:7px; border:none; background:none; color:var(--dim); font-size:11px; font-weight:700; cursor:pointer; }
  .chip:hover { color:#fff; }
  .chip.on { background:#ffffff18; color:#fff; }

  /* bottom-left: legend + coords */
  #legend { position:absolute; left:10px; bottom:16px; z-index:5; padding:8px 12px 9px; font-size:10.5px; color:var(--dim); width:190px; }
  #legendtitle { color:#cfd8e1; font-size:11px; font-weight:700; }
  #legendbar { height:7px; border-radius:4px; margin:6px 0 3px; }
  #legendlbl { display:flex; justify-content:space-between; }
  .lsec { color:#cfd8e1; font-size:10.5px; font-weight:700; margin-top:7px; }
  #lx .lgrid { display:grid; grid-template-columns:1fr 1fr; gap:2px 6px; margin-top:3px; }
  #lx i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid #fff3; }
  #lx .bar { height:5px; border-radius:3px; margin-top:4px; background:linear-gradient(90deg,#fff,#ffffff55); }
  #coords { position:absolute; left:10px; bottom:2px; z-index:5; font-size:10px; color:#ffffff99; text-shadow:0 1px 2px #000; font-variant-numeric:tabular-nums; }
  #attr { position:absolute; left:50%; transform:translateX(-50%); bottom:2px; z-index:5; font-size:9.5px; color:#ffffff77; text-shadow:0 1px 2px #000; white-space:nowrap; }
  #attr a { color:inherit; }
  #gv { width:10px; height:10px; border-radius:50%; background:var(--blue); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.6); }
  #gv span { position:absolute; left:14px; top:-3px; font-size:12px; font-weight:700; color:#fff; text-shadow:0 1px 3px #000, 0 0 3px #000; white-space:nowrap; pointer-events:none; }

  /* hover value chip */
  #tip { position:absolute; z-index:8; pointer-events:none; display:none; background:rgba(20,26,34,.94); border-radius:8px; padding:5px 10px; font-size:11.5px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.45); transform:translate(-50%,calc(-100% - 12px)); line-height:1.35; }
  #tip small { color:var(--dim); display:block; }

  /* forecast card */
  #fc { position:absolute; top:10px; right:56px; z-index:7; width:min(320px,88vw); padding:16px; display:none; max-height:calc(100vh - 100px); overflow-y:auto; animation:pop .18s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(-6px) scale(.98); } }
  #fc .x { position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim); cursor:pointer; font-size:16px; }
  #fc h3 { font-size:15px; font-weight:800; padding-right:22px; }
  #fc .sub { color:var(--dim); font-size:12.5px; margin-top:2px; }
  #fc .cur { display:flex; align-items:center; gap:12px; margin:12px 0 4px; }
  #fc .cur .emo { font-size:40px; }
  #fc .cur b { font-size:40px; font-weight:800; }
  #fc .cur .desc { font-size:13.5px; color:var(--dim); line-height:1.35; }
  #fc svg { width:100%; height:56px; margin:10px 0 2px; }
  #fc table { width:100%; font-size:13px; border-collapse:collapse; margin-top:10px; }
  #fc td { padding:5px 0; border-top:1px solid var(--line); }
  #fc td.emo { font-size:17px; width:30px; }
  #fc td.rng { text-align:right; font-variant-numeric:tabular-nums; }
  #fc td.rng span { color:var(--dim); }
  #fc td.pp { text-align:right; width:44px; color:var(--blue2); font-size:12px; }
  #fc .warns { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  #fc .warn { border-left:4px solid; border-radius:6px; background:#ffffff0d; padding:7px 10px; }
  #fc .warn b { font-size:13px; display:block; }
  #fc .warn small { color:var(--dim); font-size:11.5px; }
  #fc .warn summary { cursor:pointer; list-style:none; position:relative; padding-right:16px; }
  #fc .warn summary::after { content:'▸'; position:absolute; right:0; top:2px; color:var(--dim); font-size:11px; transition:transform .15s; }
  #fc .warn details[open] summary::after { transform:rotate(90deg); }
  #fc .warn .body { margin-top:6px; font-size:12px; line-height:1.45; color:#c8d2dc; white-space:pre-line; max-height:220px; overflow-y:auto; }
  #fc .warn .body i { color:var(--dim); font-style:normal; display:block; margin-top:6px; }

  #spin { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:8; width:20px; height:20px; border:3px solid #ffffff22; border-top-color:var(--blue2); border-radius:50%; animation:spin .8s linear infinite; display:none; }
  @keyframes spin { to { transform:translateX(-50%) rotate(360deg); } }
  #err { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:9; background:#ff453a; color:#fff; padding:8px 14px; border-radius:8px; display:none; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  .maplibregl-popup-content { background:var(--bg); color:#fff; border-radius:10px; font-family:inherit; box-shadow:0 8px 28px rgba(0,0,0,.5); padding:12px 14px; }
  .maplibregl-popup-tip { border-top-color:var(--bg) !important; }
  .maplibregl-popup-content small { color:var(--dim); }
  .maplibregl-popup-close-button { color:var(--dim); }
  canvas.overlay { position:absolute; inset:0; z-index:3; pointer-events:none; }
  .maplibregl-ctrl-attrib { display:none; }
  @supports (height:100dvh) { html,body,#map { height:100dvh; } }

  @media (max-width:640px), (pointer:coarse) {
    #brand { top:calc(8px + env(safe-area-inset-top)); width:150px; padding:7px 10px; }
    #brand span { font-size:13px; }
    #panel { top:calc(52px + env(safe-area-inset-top)); width:150px; }
    #search { font-size:16px; }
    #timeline { bottom:calc(10px + env(safe-area-inset-bottom)); max-width:96vw; }
    #histchips { display:none; }
    #legend { bottom:calc(70px + env(safe-area-inset-bottom)); width:160px; }
    #fc { left:10px; right:10px; width:auto; max-height:calc(100dvh - 100px - env(safe-area-inset-bottom)); }
    #coords { display:none; }
    /* touch targets ≥ 40px; flex:none so the tight row shrinks the scrub bar, not the buttons */
    .rbtn { width:44px; height:44px; }
    #zoomctl button { width:44px; height:42px; }
    #play { width:44px; height:44px; }
    #tstep { width:40px; height:44px; flex:none; }
    #live { padding:13px 9px; flex:none; }
    #scrubwrap { width:min(120px,22vw); }
    #fttime { min-width:66px; }
  }
  @media (pointer:coarse) { #tip { display:none !important; } } /* no hover on touch; beats inline style set on mousemove */
</style>
</head>
<body>
<div id="map"></div>
<canvas id="gridcv" class="overlay"></canvas>
<canvas id="windcv" class="overlay"></canvas>

<div id="brand" class="card">
  <svg viewBox="0 0 100 60" aria-label="Batman WX">
    <ellipse cx="50" cy="30" rx="48" ry="28" fill="#ffd60a"/>
    <path fill="#0b0f14" d="M50 10 L46.5 18 L43 12.5 L39.5 18.5 C24 17 10 27 6 41 C17 33.5 26 34 31 39.5 C35 36 40.5 37.5 43 44 L46.5 38.5 L50 48 L53.5 38.5 L57 44 C59.5 37.5 65 36 69 39.5 C74 34 83 33.5 94 41 C90 27 76 17 60.5 18.5 L57 12.5 L53.5 18 Z"/>
  </svg>
  <span>BATMAN <b>WX</b></span>
</div>
<div id="panel" class="card">
  <h2>WEATHER MAPS <span class="chev">▲</span></h2>
  <div class="row" data-l="SATELLITE"><span class="ic">🛰</span>Satellite</div>
  <div class="row" data-l="RADAR"><span class="ic">🌧</span>Radar</div>
  <div class="row" data-l="PRECIP"><span class="ic">💧</span>Precipitation</div>
  <div class="row" data-l="WIND"><span class="ic">💨</span>Wind</div>
  <div class="row" data-l="TEMP"><span class="ic">🌡</span>Temperature</div>
  <div class="row" data-l="HUMIDITY"><span class="ic">💦</span>Humidity</div>
  <div class="row" data-l="PRESSURE"><span class="ic">⏲</span>Pressure</div>
  <div class="sect">
    <div class="row on" id="ltgbtn"><span class="ic">⚡</span>Lightning<span class="dot"></span></div>
    <div class="row" id="stormbtn"><span class="ic">🌪</span>Storm tracks<span class="dot"></span></div>
    <div class="row on" id="tropbtn"><span class="ic">🌀</span>Tropical<span class="dot"></span></div>
    <div class="row on" id="alertbtn2"><span class="ic">⚠️</span>Alerts<span class="dot"></span></div>
    <div class="row" id="spcbtn"><span class="ic">🎯</span>Day 1 Outlook<span class="dot"></span></div>
    <div class="row" id="mcdbtn"><span class="ic">📝</span>Meso Discussions<span class="dot"></span></div>
  </div>
</div>

<div id="rail">
  <button class="rbtn" id="searchbtn" title="Search">🔍</button>
  <button class="rbtn" id="geo2" title="My location">◎</button>
  <button class="rbtn" id="radbtn" title="Radar sites">📡</button>
  <button class="rbtn" id="alertbtn" title="Active alerts"><span id="acount">–</span>⚠️</button>
</div>
<div id="zoomctl"><button id="zin">+</button><button id="zout">−</button></div>

<div id="searchwrap">
  <input id="search" placeholder="Search place, address, or lat, lon…" autocomplete="off">
  <div id="results" class="card"></div>
</div>
<div id="sites" class="card"><input id="sitefilter" placeholder="Filter radar sites…" autocomplete="off"><div id="sitelist"></div></div>

<div id="timeline" class="card">
  <button id="play">▶</button>
  <div id="scrubwrap">
    <input id="scrub" type="range" min="0" max="0" value="0" step="1">
    <div id="nowmark"></div>
  </div>
  <span id="ftdate">—</span>
  <span id="fttime">—</span>
  <button id="live" title="Jump to live radar">LIVE</button>
  <button id="tstep" title="Step forward">⏭</button>
  <div id="histchips">
    <button class="chip on" data-h="2">2h</button>
    <button class="chip" data-h="6">6h</button>
    <button class="chip" data-h="12">12h</button>
    <button class="chip" data-h="24">24h</button>
    <button class="chip" id="speed" data-s="1">1×</button>
  </div>
</div>

<div id="legend" class="card">
  <span id="legendtitle">Radar</span>
  <div id="legendbar"></div>
  <div id="legendlbl"><span id="lmin">Light</span><span id="lmid">Moderate</span><span id="lmax">Heavy</span></div>
  <div id="lx"></div>
</div>
<div id="coords"></div>
<div id="attr">© <a href="https://batman.zip">batman.zip</a> · OpenStreetMap · NOAA · RainViewer · NASA · Open-Meteo · Esri</div>
<div id="tip"></div>

<div id="fc" class="card"><button class="x">✕</button><div id="fcbody"></div></div>
<div id="spin"></div>
<div id="err"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const err = m => { $('err').textContent = m; $('err').style.display = 'block'; setTimeout(() => $('err').style.display = 'none', 6000); };
let busy = 0;
const spin = on => { busy = Math.max(0, busy + (on ? 1 : -1)); $('spin').style.display = busy ? 'block' : 'none'; };

/* ---------- zoom.earth palette LUTs (exact 512-entry strips lifted from their app) ---------- */
const LUT = {}; // name → Uint8ClampedArray(512*4)
function loadLUTs() {
  return Promise.all(Object.entries(PALETTE_PNG).map(([k, uri]) => new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = 512; c.height = 1;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(im, 0, 0);
      LUT[k] = x.getImageData(0, 0, 512, 1).data;
      res();
    };
    im.onerror = res;
    im.src = uri;
  })));
}
const lutColor = (name, frac) => { // frac 0..1 → [r,g,b]
  const d = LUT[name]; if (!d) return [0, 0, 0];
  const i = Math.max(0, Math.min(511, Math.round(frac * 511))) * 4;
  return [d[i], d[i + 1], d[i + 2]];
};
const lutCSS = name => { // palette strip → CSS gradient for legends
  const stops = [];
  for (let i = 0; i <= 10; i++) { const [r, g, b] = lutColor(name, i / 10); stops.push(`rgb(${r},${g},${b}) ${i * 10}%`); }
  return `linear-gradient(90deg,${stops.join(',')})`;
};
/* zoom.earth radar index curve: idx = 511·(v·1.35)^5.5, v = normalized reflectivity */
const radarIdx = v => Math.max(0, Math.min(511, Math.floor(511 * Math.pow(Math.min(1, v * 1.35), 5.5))));

/* NEXRAD BR reflectivity color table (dBZ). 3-value stops blend into the next stop;
   6-value stops carry their own gradient end, then jump to the next stop's start. */
const BR_STOPS = [
  [-35, [254, 254, 254]],
  [-5,  [24, 24, 24],    [24, 24, 24]],
  [0,   [5, 5, 66]],
  [15,  [97, 97, 206],   [130, 130, 249]],
  [20,  [108, 252, 108]],
  [35,  [24, 113, 24],   [0, 60, 0]],
  [40,  [255, 249, 106]],
  [45,  [255, 181, 51],  [255, 112, 2]],
  [50,  [252, 0, 1]],
  [60,  [143, 0, 0],     [93, 0, 0]],
  [75,  [93, 0, 0]],
];
function brColor(dbz) {
  if (dbz <= BR_STOPS[0][0]) return BR_STOPS[0][1];
  for (let i = 0; i < BR_STOPS.length - 1; i++) {
    const [d0, c0, cEnd] = BR_STOPS[i], [d1, c1] = BR_STOPS[i + 1];
    if (dbz < d1) {
      const t = (dbz - d0) / (d1 - d0), e = cEnd || c1;
      return c0.map((v, j) => Math.round(v + (e[j] - v) * t));
    }
  }

/* ---------- live lightning (Blitzortung) — zoom.earth style: white flash, fading white dot ---------- */
let strikes = [];
function ltgLZW(b) {
  const dict = {}, data = b.split('');
  let cur = data[0], oldPhrase = cur, code = 256, phrase;
  const out = [cur];
  for (let i = 1; i < data.length; i++) {
    const cc = data[i].charCodeAt(0);
    phrase = cc < 256 ? data[i] : (dict[cc] || oldPhrase + cur);
    out.push(phrase);
    cur = phrase.charAt(0);
    dict[code++] = oldPhrase + cur;
    oldPhrase = phrase;
  }
  return out.join('');
}
let ltgGot = false;
function ltgConnect(n = 0) {
  if (n > 11) { console.warn('lightning: could not reach blitzortung.org'); return; }
  try {
    const ws = new WebSocket('wss://ws' + [1, 3, 7, 8][n % 4] + '.blitzortung.org/');
    ws.onopen = () => ws.send('{"a":111}');
    ws.onmessage = m => {
      try {
        const j = JSON.parse(ltgLZW(m.data));
        if (j.lat != null) { strikes.push({ lon: j.lon, lat: j.lat, t: Date.now() }); n = 0; if (!ltgGot) { ltgGot = true; drawLtg(); } }
      } catch { /* skip bad frame */ }
    };
    ws.onclose = () => setTimeout(() => ltgConnect(n + 1), 4000);
  } catch { setTimeout(() => ltgConnect(n + 1), 4000); }
}
function drawLtg() {
  const now = Date.now();
  strikes = strikes.filter(s => s.t > now - 5 * 60 * 1000).slice(-5000); // keep last 5 min
  if (!map.getSource('ltg')) return;
  map.getSource('ltg').setData({ type: 'FeatureCollection', features: strikes.map(s => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [s.lon, s.lat] }, properties: { age: (now - s.t) / 1000 } })) });
}
function ltgLayers() {
  const vis = { visibility: toggles.LTG ? 'visible' : 'none' };

    paint: {

/* ---------- Open-Meteo screen-space grid (temp/humidity/pressure/precip heatmaps + wind field) ---------- */
// ponytail: point-grid + bilinear field, not raster tiles — swap in precomputed GFS tiles if quality matters
const NX = 16, NY = 10;
const gcv = $('gridcv'), gctx = gcv.getContext('2d');
const wcv = $('windcv'), wctx = wcv.getContext('2d');
const off = document.createElement('canvas'); off.width = NX; off.height = NY;
let grid = null, gridAbort = null, moving = false;

/* value → zoom.earth palette color, using their exact ranges:
   temperature −89…60 °C · humidity 0…102 % · pressure 859.5…1085 hPa · wind (v+63.5)/127.5 m/s */
const GRIDMAP = {
  TEMP:     { pal: 'temperature',   f: g => ((g.t - 32) * 5 / 9 + 89) / 149, label: g => Math.round(g.t) + '°', unit: v => Math.round(v) + ' °F' },
  HUMIDITY: { pal: 'humidity',      f: g => g.rh / 102,                      label: g => Math.round(g.rh) + '%', unit: v => Math.round(v) + ' %' },
  PRESSURE: { pal: 'pressure',      f: g => (g.p - 859.5) / 225.5,           label: g => Math.round(g.p), unit: v => Math.round(v) + ' hPa' },
  PRECIP:   { pal: 'precipitation', f: g => radarIdx(Math.min(1, g.pr / 12)) / 511, label: g => g.pr > 0 ? g.pr.toFixed(1) : '', unit: v => (v / 25.4).toFixed(2) + ' in/h' },
};
const GRID_LAYERS = ['TEMP', 'HUMIDITY', 'PRESSURE', 'PRECIP', 'WIND'];

async function fetchGrid() {
  if (gridAbort) gridAbort.abort();
  gridAbort = new AbortController();
  const lats = [], lons = [], w = innerWidth, h = innerHeight;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const ll = map.unproject([(x + .5) * w / NX, (y + .5) * h / NY]);
    lats.push(Math.max(-85, Math.min(85, ll.lat)).toFixed(2));
    lons.push((((ll.lng + 180) % 360 + 360) % 360 - 180).toFixed(2));
  }
  spin(true);
  try {
    const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lons.join(',')}&current=temperature_2m,wind_speed_10m,wind_direction_10m,relative_humidity_2m,pressure_msl,precipitation&temperature_unit=fahrenheit&wind_speed_unit=mph`, { signal: gridAbort.signal })).json();
    const arr = Array.isArray(j) ? j : [j];
    grid = {
      tl: map.unproject([0, 0]), br: map.unproject([w, h]),
      pts: arr.map((p, i) => ({ lat: +lats[i], lon: +lons[i], t: p.current.temperature_2m, ws: p.current.wind_speed_10m,
        wd: p.current.wind_direction_10m, rh: p.current.relative_humidity_2m, p: p.current.pressure_msl, pr: p.current.precipitation }))
    };
    paintGrid();
    drawGrid();
  } catch (e) { if (e.name !== 'AbortError') err('Weather grid failed: ' + e.message); }
  finally { spin(false); }
}
function paintGrid() {
  const gm = GRIDMAP[mainLayer]; if (!gm || !grid) return;
  const img = off.getContext('2d').createImageData(NX, NY);
  grid.pts.forEach((g, i) => {
    const c = lutColor(gm.pal, gm.f(g));
    img.data.set([...c, mainLayer === 'PRECIP' && g.pr <= 0 ? 0 : 255], i * 4);
  });
  off.getContext('2d').putImageData(img, 0, 0);
}

function gridRect() { const p0 = map.project(grid.tl), p1 = map.project(grid.br); return [p0.x, p0.y, p1.x - p0.x, p1.y - p0.y]; }

function drawGrid() {

/* wind: particle flow tinted by the zoom.earth wind-speed ramp */
let particles = [];
function windAt(x, y) {
  const [rx, ry, rw, rh] = gridRect();
  const fx = Math.max(0, Math.min(NX - 1.001, (x - rx) / rw * NX - .5));
  const fy = Math.max(0, Math.min(NY - 1.001, (y - ry) / rh * NY - .5));
  const x0 = Math.floor(fx), y0 = Math.floor(fy), kx = fx - x0, ky = fy - y0;
  let u = 0, v = 0, s = 0;
  for (const [dx, dy, w] of [[0,0,(1-kx)*(1-ky)],[1,0,kx*(1-ky)],[0,1,(1-kx)*ky],[1,1,kx*ky]]) {
    const g = grid.pts[(y0 + dy) * NX + x0 + dx], a = (g.wd + 180) * Math.PI / 180;
    u += w * g.ws * Math.sin(a); v += w * -g.ws * Math.cos(a); s += w * g.ws;
  }
  return { vx: u * 0.09, vy: v * 0.09, ws: s };
}
const windColor = mph => { const [r, g, b] = lutColor('wind-speed', (mph * 0.447 + 63.5) / 127.5); return `rgb(${r},${g},${b})`; };

  wctx.fillStyle = 'rgba(0,0,0,0.93)'; wctx.fillRect(0, 0, innerWidth, innerHeight);
  wctx.globalCompositeOperation = 'source-over';
  wctx.lineWidth = 2; wctx.lineCap = 'round';
  for (const p of particles) {
    const w = windAt(p.x, p.y);
    const nx2 = p.x + w.vx, ny2 = p.y + w.vy;
    wctx.strokeStyle = windColor(w.ws);
    wctx.beginPath(); wctx.moveTo(p.x, p.y); wctx.lineTo(nx2, ny2); wctx.stroke();
    p.x = nx2; p.y = ny2; p.age++;
    if (p.age > 110 || p.x < 0 || p.x > innerWidth || p.y < 0 || p.y > innerHeight || w.ws < .3) Object.assign(p, spawn(), { age: 0 });

}
(function tick() {

/* ---------- cursor tooltip + coordinates (zoom.earth style) ---------- */
const fmtDMS = (v, pos, neg) => {
  const h = v < 0 ? neg : pos, a = Math.abs(v);
  const d = Math.floor(a), m = Math.floor((a - d) * 60), s = Math.round(((a - d) * 60 - m) * 60);
  return `${d}° ${m}′ ${s}″ ${h}`;
};
function radarValueAt(lngLat) { // sample the recolored frame's grayscale cache at the cursor
  const fr = frames.RADAR; if (!fr || !fr.length) return null;
  const f = fr[Math.min(Math.round(pos), fr.length - 1)];
  if (!f || (!f.rv && !f.iem)) return null;
  const z = Math.max(0, Math.min(f.iem ? 9 : 8, Math.floor(map.getZoom())));
  const n = Math.pow(2, z);
  const xt = (lngLat.lng + 180) / 360 * n;
  const la = lngLat.lat * Math.PI / 180;
  const yt = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n;
  const tx = Math.floor(xt), ty = Math.floor(yt);

  const t = tileCache.get(key); if (!t) return null;
  const px = Math.min(t.n - 1, Math.floor((xt - tx) * t.n)), py = Math.min(t.n - 1, Math.floor((yt - ty) * t.n));
  const v = t.val[py * t.n + px];

  return { dbz: v / 2 - 32 };
}
function gridValueAt(pt) {
  if (!grid) return null;
  const [rx, ry, rw, rh] = gridRect();
  const gx = Math.round((pt.x - rx) / rw * NX - .5), gy = Math.round((pt.y - ry) / rh * NY - .5);

}

/* ---------- search (Photon geocoder) ---------- */
let searchDeb, searchAbort, hits = [], sel = -1, searchMarker = null;
$('searchbtn').onclick = () => {
  const w = $('searchwrap');
  const open = w.style.display !== 'block';
  w.style.display = open ? 'block' : 'none';

};
const TYPE_ICO = { city: '🏙️', town: '🏘️', village: '🏘️', hamlet: '🏘️', country: '🌍', state: '🗺️', county: '🗺️', street: '🛣️', house: '🏠', district: '🏙️' };
const fmtHit = p => ({
  title: p.name || [p.housenumber, p.street].filter(Boolean).join(' ') || '?',
  sub: [p.city, p.state || p.county, p.country].filter(x => x && x !== p.name).slice(0, 2).join(', '),
  ico: TYPE_ICO[p.type] || '📍'
});
function renderHits() {
  const r = $('results');
  r.innerHTML = hits.length
    ? hits.map((f, i) => { const v = fmtHit(f.properties);
        return `<div class="${i === sel ? 'sel' : ''}" data-i="${i}"><span class="ico">${v.ico}</span><div>${v.title}<small>${v.sub}</small></div></div>`; }).join('')
    : '<div class="empty"><small>No results</small></div>';
  r.style.display = 'block';
  r.querySelectorAll('div[data-i]').forEach(el => el.onmousedown = e => { e.preventDefault(); pick(+el.dataset.i); });
}
function pick(i) {
  const f = hits[i]; if (!f) return;
  const p = f.properties, [lon, lat] = f.geometry.coordinates, v = fmtHit(p);
  $('search').value = v.title + (v.sub ? ', ' + v.sub : '');
  $('results').style.display = 'none'; $('search').blur(); $('searchwrap').style.display = 'none';
  if (searchMarker) searchMarker.remove();
  searchMarker = new maplibregl.Marker({ color: '#0a84ff' }).setLngLat([lon, lat]).addTo(map);
  if (p.extent) {
    const [w, n, e, s] = p.extent;
    map.fitBounds([[w, s], [e, n]], { padding: 90, duration: 2000, maxZoom: 14 });
  } else map.flyTo({ center: [lon, lat], zoom: { country: 4, state: 6, county: 8, city: 10, town: 11, village: 13, street: 15, house: 16 }[p.type] || 11, duration: 2000 });
}
async function doSearch(q) {
  if (searchAbort) searchAbort.abort();
  const ll = q.match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
  if (ll && Math.abs(+ll[1]) <= 90 && Math.abs(+ll[2]) <= 180) {
    hits = [{ properties: { name: `${(+ll[1]).toFixed(3)}, ${(+ll[2]).toFixed(3)}`, type: 'locality' }, geometry: { coordinates: [+ll[2], +ll[1]] } }];
    sel = 0; renderHits(); return;
  }
  searchAbort = new AbortController();
  try {
    const c = map.getCenter();
    const j = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${c.lat.toFixed(2)}&lon=${c.lng.toFixed(2)}`, { signal: searchAbort.signal })).json();
    const seen = new Set();
    hits = (j.features || []).filter(f => {
      const v = fmtHit(f.properties), k = v.title + '|' + v.sub;
      return seen.has(k) ? false : (seen.add(k), true);
    }).slice(0, 6);
    sel = hits.length ? 0 : -1; renderHits();
  } catch (e) {
    if (e.name !== 'AbortError') {
      try {
        const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6`)).json();
        hits = (j.results || []).map(p => ({ properties: { name: p.name, state: p.admin1, country: p.country, type: 'city' }, geometry: { coordinates: [p.longitude, p.latitude] } }));
        sel = hits.length ? 0 : -1; renderHits();
      } catch { /* both geocoders down */ }
    }
  }
}
$('search').oninput = e => {
  clearTimeout(searchDeb);
  const q = e.target.value.trim();
  if (q.length < 2) { $('results').style.display = 'none'; hits = []; sel = -1; return; }
  searchDeb = setTimeout(() => doSearch(q), 250);
};
$('search').onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!hits.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    renderHits();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const q = e.target.value.trim();
    if ($('results').style.display !== 'none' && hits.length) pick(Math.max(0, sel));
    else if (q.length >= 2) { clearTimeout(searchDeb); doSearch(q).then(() => pick(0)); }
  } else if (e.key === 'Escape') { $('results').style.display = 'none'; $('searchwrap').style.display = 'none'; }
};
document.addEventListener('click', e => {
  if (!$('searchwrap').contains(e.target) && e.target !== $('searchbtn') && !$('searchbtn').contains(e.target)) $('results').style.display = 'none';
});
$('geo2').onclick = () => navigator.geolocation.getCurrentPosition(
  p => map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 9, duration: 2200 }),
  () => err('Location unavailable'));

/* ---------- boot ---------- */
sizeCanvas(wcv, wctx);
map.on('load', async () => {
  await loadLUTs(); // palettes must be ready before the zr protocol recolors tiles
  await applyBasemap();
  loadAlerts(); setInterval(loadAlerts, 5 * 60 * 1000);
  loadStorms(); setInterval(loadStorms, 2 * 60 * 1000);
  loadSPS(); setInterval(loadSPS, 5 * 60 * 1000);
  ltgLayers(); ltgConnect(); setInterval(drawLtg, 400); // fast tick so the flash decay animates
  loadTropical(); setInterval(loadTropical, 15 * 60 * 1000);
  await loadNowcast();
  setInterval(() => loadNowcast().then(() => {
    if ((mainLayer === 'RADAR' || mainLayer === 'SATELLITE') && playing) { clearFrames(); setupTimeline(); }
  }), 10 * 60 * 1000);
  const target = mainLayer; mainLayer = ''; // force full layer setup on boot
  setLayer(target);
  if (target === 'RADAR' || target === 'SATELLITE') setLive(true); // default: live mode
  // touchscreen laid out wide = Chrome "Desktop site" is on, ignoring the viewport meta.
  // ponytail: maxTouchPoints (hardware) survives desktop-site's UA/pointer spoofing; no pointer:coarse gate
  // (desktop-site can report pointer:fine). Rare false positive on a wide touchscreen laptop — mild hint, fine.
  if (navigator.maxTouchPoints > 0 && document.documentElement.clientWidth > 700)
    err('Turn OFF "Desktop site" in the Chrome ⋮ menu for the mobile layout');
});
/* ?debug — remote diagnosis overlay: what the device actually reports for viewport/canvas */
if (/\bdebug\b/.test(location.search)) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;z-index:99;background:#000c;color:#0f0;font:11px/1.4 monospace;padding:6px;white-space:pre;pointer-events:none';
  const upd = () => { const cv = document.querySelector('#map canvas.maplibregl-canvas');
    d.textContent = `inner ${innerWidth}×${innerHeight}\nclientW ${document.documentElement.clientWidth}\ndpr ${devicePixelRatio}\ncanvas attr ${cv?.width}×${cv?.height}\ncanvas css ${cv?.style.width} ${cv?.style.height}\nvv ${visualViewport.width.toFixed(0)}×${visualViewport.height.toFixed(0)} s${visualViewport.scale.toFixed(2)}`; };
  document.body.appendChild(d); upd(); setInterval(upd, 500);
}
</script>
</body>
