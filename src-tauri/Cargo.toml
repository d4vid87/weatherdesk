[package]
name = "weatherdesk"
version = "3.2.1"
description = "Self-hosted WeatherFlow Tempest dashboard"
authors = ["David May"]
license = "MIT"
edition = "2021"

# The Android build links the app as a library (`cargo tauri android init` generates a project that
# expects exactly this name); the desktop binary is a shim over the same `run()`.
[lib]
name = "weatherdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `--no-default-features` drops Tauri (and with it GTK/WebKit) entirely and leaves the LAN
# server and the archive: that is the Docker image, and it builds on a machine with no desktop
# libraries installed at all.
[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
# An OS notification when the window is hidden — the in-page banner is no use behind another window.
tauri-plugin-notification = { version = "2", optional = true }
# already in tauri's tree; named here only to parse the hub's UDP broadcasts
serde_json = "1"

# Serving the dashboard to the rest of the LAN is a desktop job — Android neither serves nor
# receives the hub's broadcasts.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tiny_http = "0.12"
# The observation archive. Bundled: a wall tablet's distro is not where you go looking for a
# matching libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# Blocking HTTPS for the history backfill — works with no async runtime and no window.
ureq = "2"
# The dashboard itself, so the headless binary is one file with nothing beside it.
include_dir = "0.7"
# MQTT for the Home Assistant integration. The blocking client: this binary has no async
# runtime and does not want one for a publish every ten seconds.
# Pins us to rustls-webpki 0.102.8, which carries RUSTSEC-2026-0104 — a CRL-parsing panic this app
# cannot reach, because it passes no RevocationOptions. Read SECURITY.md before "fixing" it.
rumqttc = "0.24"
# Advertise the dashboard on the LAN: how Home Assistant's config flow finds this server, and
# how the setup wizard finds a WeatherLink Live (which advertises the same way).
mdns-sd = "0.11"
# Desktop updates in place. Android is signed with its own key and stays a sideload.
tauri-plugin-updater = { version = "2", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
